name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install

      - name: Build web
        run: npm run build

      - name: Buat project Android
        run: npx cap add android

      - name: Konfigurasi Google Sign-In
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/variables.gradle")

          if not path.exists():
              raise SystemExit("android/variables.gradle tidak ditemukan")

          content = path.read_text()

          if "rgcfaIncludeGoogle" not in content:
              if "ext {" not in content:
                  raise SystemExit("Blok ext { tidak ditemukan")

              content = content.replace(
                  "ext {",
                  "ext {\n"
                  "    rgcfaIncludeGoogle = true\n"
                  "    androidxCredentialsVersion = '1.3.0'",
                  1
              )

              path.write_text(content)

          print("Konfigurasi Google Sign-In berhasil dipasang.")
          PY

      - name: Pasang logo (jika ada assets/icon.png)
        if: hashFiles('assets/icon.png') != ''
        run: npx @capacitor/assets generate --android

      - name: Pasang google-services.json
        run: |
          if [ ! -f google-services.json ]; then
            echo "::error::google-services.json belum ada di root repo."
            exit 1
          fi
          cp google-services.json android/app/google-services.json

      - name: Sync
        run: npx cap sync android

      - name: Pakai kunci tetap
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          # Paksa Gradle menandatangani APK dengan debug.keystore dari repo
          # (tanpa ini, Gradle bisa membuat kunci baru sehingga SHA-1 berubah dan login Google gagal)
          cat > "$RUNNER_TEMP/signing.init.gradle" <<'GRADLE'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('com.android.application')) {
                p.android.signingConfigs.debug {
                  storeFile new File(System.getenv('KS_PATH'))
                  storeType 'pkcs12'
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
                }
              }
            }
          }
          GRADLE

      - name: Ambil SHA-1 keystore
        run: |
          keytool -list -v \
            -keystore debug.keystore \
            -storepass android | grep -E "Alias|SHA1|SHA256"

      - name: Build APK
        working-directory: android
        env:
          KS_PATH: ${{ github.workspace }}/debug.keystore
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --init-script "$RUNNER_TEMP/signing.init.gradle"

      - name: Verifikasi SHA-1 APK
        run: |
          EXPECTED="A0:80:2B:0B:99:CF:07:A6:9E:EF:89:F5:55:3C:A8:06:FB:F7:2F:B7"
          ACTUAL=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 "SHA1:" | awk '{print $2}')
          echo "SHA-1 APK      : $ACTUAL"
          echo "SHA-1 diharapkan: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::SHA-1 APK tidak sama dengan yang terdaftar di Firebase. Login Google akan gagal."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: RIPPLE-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
